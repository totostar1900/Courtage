[project]
name = "courtage"
version = "0.1.0"
description = "Courtier d'assurance digital — API et moteur actuariel"
requires-python = ">=3.11"
dependencies = ["python-dateutil>=2.9", "pydantic>=2.6", "openpyxl>=3.1", "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1", "fastapi>=0.110", "python-multipart>=0.0.9", "uvicorn>=0.29", "jinja2>=3.1", "weasyprint>=62", "httpx>=0.27", "pypdf>=4", "anthropic>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pymupdf>=1.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"courtage.referentiel" = ["donnees/*.json"]
"courtage.services" = ["gabarits/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
