[project]
name = "courtage"
version = "0.1.0"
description = "Courtier d'assurance digital — API et moteur actuariel"
requires-python = ">=3.11"
dependencies = ["python-dateutil>=2.9", "pydantic>=2.6", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"courtage.referentiel" = ["donnees/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
